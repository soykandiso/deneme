services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zalba
      POSTGRES_PASSWORD: zalba
      POSTGRES_DB: zalba
    ports: ["5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zalba -d zalba"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://zalba:zalba@postgres:5432/zalba?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: zalba-attachments
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      JWT_MOBILE_SECRET: dev-mobile-secret-change-me
      JWT_PORTAL_SECRET: dev-portal-secret-change-me
      JWT_ADMIN_SECRET: dev-admin-secret-change-me
      SESSION_SECRET: dev-session-secret-change-me
      IP_HASH_PEPPER: dev-pepper-change-me
      PUBLIC_BASE_URL: http://localhost:3000
      PORT: "3000"
    ports: ["3000:3000"]
    # On every boot: apply migrations, run the idempotent seed, then start.
    # `dist/main.js` is the expected output path; `dist/src/main.js` is a
    # fallback for tsc-versions that emit relative to the implicit rootDir.
    command: >
      sh -c "npx prisma migrate deploy
      && node prisma/seed.js
      && { [ -f dist/main.js ] && node dist/main.js || node dist/src/main.js; }"

volumes:
  pg-data:
  minio-data:
